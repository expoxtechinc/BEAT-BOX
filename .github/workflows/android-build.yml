name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "client/**"
      - "server/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build BeatBox Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web regression checks
        run: |
          pnpm test
          pnpm run check

      - name: Build BeatBox web app
        run: pnpm build

      - name: Synchronize Capacitor Android project
        run: pnpm exec cap sync android

      - name: Build debug APK and unsigned release AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload BeatBox debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatBox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload BeatBox unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BeatBox-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
